services:
  wishsale:
    build: .
    image: wishsale:latest
    container_name: wishsale
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Minsk
      # Прокси для Telegram API (см. README): в РБ api.telegram.org заблокирован
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
    volumes:
      - ./data:/app/data          # SQLite-база (переживает пересоздание контейнера)
      - ./logs:/app/logs          # логи приложения
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/wishsale.db').execute('select 1')"]
      interval: 1m
      timeout: 5s
      retries: 3
